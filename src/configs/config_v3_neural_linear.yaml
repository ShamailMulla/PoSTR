gpu: true
data_dir: ''
save: false
save_freq: 1000
load: false
load_dir: ./logdir/[env]/BTRL-[name]/[seed]/checkpoints/[timestep]/
visual: false
algorithm:
  name: BTRL
  update_freq: 100
  warmup_length: 10
  warmup_freq: 10
  policy_noise: 0.0
  n_samples: 1
  temp: 0.0001
  neural_linear: true
  noise_variance: 1.0
  blr_coefficient: 100.0
  transition_temp: 1.0
  reward_temp: 1.0
  explore_temp: 4.0   # wide acting sample (exploration); value training stays at transition_temp
experiment:
  suite: bsuite
  env: '5'
  test: true
  deterministic: true
  randomize_actions: true   # real DeepSea: per-cell action mapping (false = pre-2026-09 debug mode)
  legacy_goal: false        # true reproduces the pre-2026-09 task (episode ends with 0.99 on reaching the corner)
  # mapping_seed: defaults to the run seed, shared by train and test envs
  steps: 1000000
  time_limit: 6
  test_freq: 1000
  name: v3_neural_linear
  seed: null
replay:
  capacity: 10000
  batch_size: 100
  sequence_length: 6
  protected_fraction: 0.0
transition:
  obs_type: grid
  training_iterations: 10
  hidden_dim: 512
  learning_rate: 0.004132765459466363
  window_length: 3
  context_length: 2
  num_encoder_layers: 3
  heads: 4
  forward_expansion: 2
  p_seq: 0.0
  p_attn: 0.0
value:
  training_iterations: 50
  hidden_layers: 3
  hidden_dim: 16
  learning_rate: 0.0026956306023347178
  target_update_freq: 50
  discount: 0.95
terminal:
  training_iterations: 3
  hidden_layer: 1
  hidden_dim: 8
  learning_rate: 0.001
